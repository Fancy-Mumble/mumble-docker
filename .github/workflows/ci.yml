name: CI

on: [ push, pull_request ]

jobs:
    get_version:
        runs-on: ubuntu-latest
        outputs:
            mumble_version: ${{ steps.version.outputs.mumble_version }}
        steps:
            - name: Read fancy mumble version from CMakeLists.txt
              id: version
              run: |
                CONTENT=$(curl -fsSL https://raw.githubusercontent.com/SetZero/mumble-server/1.6.x/CMakeLists.txt)
                MAJOR=$(echo "$CONTENT" | grep 'FANCY_VERSION_MAJOR' | grep -oP '[0-9]+')
                MINOR=$(echo "$CONTENT" | grep 'FANCY_VERSION_MINOR' | grep -oP '[0-9]+')
                PATCH=$(echo "$CONTENT" | grep 'FANCY_VERSION_PATCH' | grep -oP '[0-9]+')
                echo "mumble_version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

    build_latest:
        needs: get_version
        permissions:
            packages: write
        uses: ./.github/workflows/build_and_publish.yml
        with:
            mumble_version: ${{ needs.get_version.outputs.mumble_version }}
            docker_version: '0'
            store: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
            publish: false
            update_latest: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        secrets: inherit

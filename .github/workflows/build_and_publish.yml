name: Build and Publish

on:
    workflow_call:
        inputs:
            mumble_version:
                required: true
                type: string
            docker_version:
                required: true
                type: string
            store:
                description: "Push a sha-tagged image to GHCR (e.g. for main-branch CI builds)"
                required: true
                type: boolean
            publish:
                description: "Push release tags to both GHCR and DockerHub"
                required: true
                type: boolean
            update_latest:
                required: true
                type: boolean

# Builds each platform group on a native runner in parallel, then merges the
# per-platform digests into a single multi-arch manifest (when store or publish).
# Platform mapping:
#   linux/amd64              → ubuntu-latest        (native x86-64)
#   linux/arm64,linux/arm/v7 → ubuntu-24.04-arm     (native ARM64; arm/v7 via fast QEMU on ARM)
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      platforms: linux/amd64
                    - runner: ubuntu-24.04-arm
                      platforms: linux/arm64,linux/arm/v7
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Login to GitHub Container registry
              if: ${{ inputs.store || inputs.publish }}
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkout
              uses: actions/checkout@v4

            - name: Free disk space
              run: |
                sudo rm -rf /usr/local/lib/android
                sudo rm -rf /usr/share/dotnet
                sudo rm -rf /opt/ghc
                sudo rm -rf /usr/local/.ghcup
                sudo rm -rf /usr/lib/jvm
                sudo rm -rf /usr/share/swift
                df -h

            - name: Set up QEMU
              if: ${{ matrix.runner == 'ubuntu-24.04-arm' }}
              uses: docker/setup-qemu-action@v3
              with:
                image: tonistiigi/binfmt:qemu-v9.2.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push digest
              if: ${{ inputs.store || inputs.publish }}
              id: build
              uses: docker/build-push-action@v6
              with:
                context: .
                platforms: ${{ matrix.platforms }}
                outputs: type=image,name=ghcr.io/fancy-mumble/mumble-server,push-by-digest=true,name-canonical=true,push=true
                build-args: |
                    MUMBLE_VERSION=${{ inputs.mumble_version }}

            - name: Build (validate only, no push)
              if: ${{ ! inputs.store && ! inputs.publish }}
              uses: docker/build-push-action@v6
              with:
                context: .
                platforms: ${{ matrix.platforms }}
                push: false
                build-args: |
                    MUMBLE_VERSION=${{ inputs.mumble_version }}

            - name: Export digest
              if: ${{ inputs.store || inputs.publish }}
              run: |
                mkdir -p /tmp/digests
                digest="${{ steps.build.outputs.digest }}"
                touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              if: ${{ inputs.store || inputs.publish }}
              uses: actions/upload-artifact@v4
              with:
                name: digests-${{ matrix.runner }}
                path: /tmp/digests/*
                if-no-files-found: error
                retention-days: 1

    merge:
        if: ${{ inputs.store || inputs.publish }}
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                path: /tmp/digests
                pattern: digests-*
                merge-multiple: true

            - name: Login to DockerHub
              if: ${{ inputs.publish }}
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GitHub Container registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure tags (publish, with latest)
              if: ${{ inputs.publish && inputs.update_latest }}
              run: echo "TAGS=mumble-server:latest mumble-server:${{ inputs.mumble_version }} mumble-server:${{ inputs.mumble_version }}-${{ inputs.docker_version }}" >> $GITHUB_ENV

            - name: Configure tags (publish, without latest)
              if: ${{ inputs.publish && ! inputs.update_latest }}
              run: echo "TAGS=mumble-server:${{ inputs.mumble_version }} mumble-server:${{ inputs.mumble_version }}-${{ inputs.docker_version }}" >> $GITHUB_ENV

            - name: Configure tags (CI build)
              if: ${{ ! inputs.publish }}
              run: echo "TAGS=mumble-server:sha-${GITHUB_SHA:0:7}" >> $GITHUB_ENV

            - name: Create and push manifest
              run: |
                TAG_ARGS=()
                for tag in $TAGS; do
                  TAG_ARGS+=("-t" "ghcr.io/fancy-mumble/$tag")
                  if [[ "${{ inputs.publish }}" == "true" ]]; then
                    TAG_ARGS+=("-t" "fancy-mumble/$tag")
                  fi
                done
                DIGESTS=$(printf 'ghcr.io/fancy-mumble/mumble-server@sha256:%s ' $(ls /tmp/digests))
                docker buildx imagetools create "${TAG_ARGS[@]}" $DIGESTS
